[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rsnaknee"
version = "0.1.0"
description = "Learning-first scaffold for RSNA Knee Abnormality Detection"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "kaggle>=1.6",
  "numpy>=1.26",
  "pandas>=2.2",
  "PyYAML>=6.0",
  "scikit-learn>=1.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
